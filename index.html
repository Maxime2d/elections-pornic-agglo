    const TARIFS = {
      circulaires: [{ max: 1000, base: 253.77 }, { max: 10000, base: 253.77, parMille: 24.88 }, { max: Infinity, base: 477.69, parMille: 24.88 }],
      bulletinsA5: [{ max: 1000, base: 119.40 }, { max: 10000, base: 119.40, parMille: 14.93 }, { max: Infinity, base: 253.77, parMille: 12.94 }],
      bulletinsA4: [{ max: 1000, base: 175.12 }, { max: 10000, base: 175.12, parMille: 18.91 }, { max: 30000, base: 345.31, parMille: 17.91 }, { max: Infinity, base: 703.51, parMille: 14.93 }],
      affichesA1: { base10: 297, uniteSup: 0.29 },
      affichesA3: { base10: 90, uniteSup: 0.12 },
      supplementCouleur: 10
    };

    function calculerRemboursement(quantite, tranches) {
      if (quantite <= 0) return 0;
      const milliers = Math.ceil(quantite / 1000) * 1000;
      for (let i = 0; i < tranches.length; i++) {
        const t = tranches[i];
        if (milliers <= t.max) {
          if (i === 0) return t.base;
          const prevMax = tranches[i-1].max;
          return t.base + Math.floor((milliers - prevMax) / 1000) * (t.parMille || 0);
        }
      }
      return 0;
    }

    function calculerAffiche(quantite, tarif) {
      if (quantite <= 0) return 0;
      if (quantite <= 10) return tarif.base10;
      return tarif.base10 + ((quantite - 10) * tarif.uniteSup);
    }

        const totalTTC = circ * 1.055 + bull * 1.055 + affA1 * 1.20 + affA3 * 1.20;
